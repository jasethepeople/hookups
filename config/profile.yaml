# User-provided profile only. Unanswered values stay null or empty; do not infer them.

# Home ZIP code used as the local search center.
home_zip: null

# Maximum drive time, in minutes.
max_drive_minutes: null

# Inclusive preferred age bounds; adults only, with min_age at least 18.
age_range:
  # Minimum adult age.
  min_age: null
  # Maximum adult age.
  max_age: null

# Body types you explicitly prefer; use your own wording.
body_types: []

# Positions or roles you explicitly prefer; define the meaning in your answer if needed.
positions: []

# Non-negotiable qualities or conditions.
must_haves: []

# Exclusions; matching listings should be filtered out.
dealbreakers: []

# Whether you can host, travel, either, or have specific limits.
host_or_travel: null

# Your desired level of discretion and any concrete privacy boundaries.
discretion_level: null

# Your stance on PnP; specify what PnP means to you if needed.
pnp_stance: null

# Exactly three recent openers, copied verbatim.
recent_openers: []

# Exact Locanto city path slug; do not derive it from ZIP.
locanto:
  # City slug used as the first path segment in Locanto search URLs.
  city_slug: null
  # Explicit Locanto category paths, e.g. Personals/P; empty means no requests.
  categories: []

# Exact Doublelist city slug, such as the site's city path segment; do not infer from ZIP.
doublelist:
  # City slug used after /city/ in Doublelist search URLs.
  city_slug: null
  # Explicit Doublelist category slugs; empty means no search requests.
  categories: []

# Public Squirt cruising-listings page URL; never infer a location from ZIP.
squirt:
  # Full HTTPS URL for a public listings page; null means no request.
  listings_url: null

# Fixed public Reddit communities requested for this source.
reddit:
  # Fetch only these subreddits; use the exact public community names.
  subreddits:
    - SLCr4r
    - r4r
